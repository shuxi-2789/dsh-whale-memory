# ============================================================================
# dsh-whale-memory —— DSH bundle patch（插件**自带**的挂载声明）
# ============================================================================
# 标准 DSH 插件的样子：包自己声明要往 profile 的配置树里插什么。
# 装上之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效：
#
#   dsh plugin --profile desktop add dsh-whale-memory
#   （本地开发时用：dsh plugin --profile desktop add link:<本插件目录>）
#
# ⚠️ loader entry 的 **id 必须等于模块导出的 name**（'whale-memory'），
#    否则 settings 层不认、Config 里的 volatile 字段写不进去（dsh-bili-scroll 同款坑）。
# ============================================================================

- insert:
    - id: whale-memory
      name: dsh-whale-memory
      config:
        # 用户配置在插件自己的 Config（家目录 config.json 由它铺设）；这里只放默认值
        enabled: true
